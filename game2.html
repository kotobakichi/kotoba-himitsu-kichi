
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>なかまえらびゲーム</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  height: 100vh;
  height: 100dvh;
  padding: 5px 8px;
  background: #fff8ed;
  font-family: sans-serif;
  color: #333;
  display: flex;
  flex-direction: column;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  font-weight: bold;
}

.hidden {
  display: none !important;
}

h1 {
  flex: 0 0 auto;
  color: #f28a45;
  text-align: center;
  font-size: 23px;
  margin: 2px 0 7px;
}

.container {
  flex: 1;
  min-height: 0;
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 10px;
  background: white;
  border-radius: 17px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
  overflow: hidden;
}

/* 難易度選択 */

#startScreen {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
}

#startScreen h2 {
  font-size: 22px;
  margin: 10px 0;
}

.level-description {
  font-size: 15px;
  margin: 8px 0 20px;
}

.level-buttons {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 400px;
  margin: 0 auto;
}

.level-button {
  padding: 15px 8px;
  border-radius: 14px;
  background: #fff0df;
  color: #333;
  font-size: 18px;
  border: 2px solid #ffd5ad;
}

.level-button small {
  font-size: 13px;
}

/* ゲーム画面 */

#gameScreen {
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.status {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-bottom: 7px;
}

.status div {
  background: #fff0df;
  padding: 7px 3px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: bold;
  text-align: center;
}

.timer {
  flex: 0 0 auto;
  background: #f4f4f4;
  padding: 7px;
  border-radius: 10px;
  margin-bottom: 5px;
  font-size: 15px;
  font-weight: bold;
  text-align: center;
}

.instruction {
  flex: 0 0 auto;
  font-size: 14px;
  margin: 5px 0 2px;
  text-align: center;
}

.category {
  flex: 0 0 auto;
  color: #f28a45;
  font-size: 25px;
  font-weight: bold;
  margin: 3px 0 5px;
  text-align: center;
}

.message {
  flex: 0 0 auto;
  min-height: 25px;
  font-size: 16px;
  font-weight: bold;
  margin: 2px 0 5px;
  text-align: center;
}

.message.correct {
  color: #20a34a;
}

.message.wrong {
  color: #e34b4b;
}

/* カード配置 */

.cards {
  flex: 1;
  min-height: 0;
  display: grid;
  gap: 7px;
  margin: 3px 0 7px;
  overflow: hidden;
}

.cards.level1 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
}

.cards.level2 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
}

.cards.level3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: repeat(3, minmax(0, 1fr));
}

.card {
  min-width: 0;
  min-height: 0;
  background: #fff2e2;
  border: 2px solid transparent;
  border-radius: 12px;
  padding: 4px 3px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.card img {
  display: block;
  width: 100%;
  height: 65%;
  min-height: 0;
  object-fit: contain;
  background: white;
  margin-bottom: 3px;
}

.card-name {
  flex: 0 0 auto;
  font-size: 14px;
  font-weight: bold;
  color: #111;
  line-height: 1.2;
}

.card.correct {
  background: #e9ffeb;
  border-color: #39b653;
}

.card.wrong {
  background: #ffe8e8;
  border-color: #e34b4b;
}

.card:disabled {
  cursor: default;
}

/* 戻るボタン */

.change-button {
  flex: 0 0 auto;
  align-self: center;
  margin: 0 auto 2px;
  padding: 7px 16px;
  border-radius: 20px;
  background: #eee;
  color: #555;
  font-size: 12px;
}

/* 結果画面 */

#resultScreen {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.result-title {
  color: #f28a45;
  font-size: 25px;
}

.result-score {
  font-size: 21px;
  font-weight: bold;
  margin: 15px 0;
}

.result-time {
  font-size: 19px;
  font-weight: bold;
  margin: 10px 0 20px;
  color: #e58b43;
}

.restart-button {
  background: #f5a052;
  color: white;
  border-radius: 15px;
  padding: 13px 22px;
  font-size: 16px;
}

/* パソコン用 */

@media screen and (min-width: 601px) {
  body {
    padding: 12px;
  }

  h1 {
    font-size: 28px;
    margin: 5px 0 12px;
  }

  .container {
    padding: 15px;
    border-radius: 20px;
  }

  .status div {
    padding: 10px;
    font-size: 16px;
  }

  .timer {
    padding: 9px;
    font-size: 17px;
  }

  .instruction {
    font-size: 16px;
    margin: 8px 0 3px;
  }

  .category {
    font-size: 29px;
    margin: 5px 0;
  }

  .message {
    font-size: 18px;
    min-height: 29px;
  }

  .cards {
    gap: 10px;
  }

  .card {
    padding: 8px;
    border-radius: 15px;
  }

  .card-name {
    font-size: 17px;
  }

  .change-button {
    font-size: 14px;
    padding: 9px 20px;
  }
}

/* 画面の高さが小さい場合 */

@media screen and (max-height: 650px) {
  h1 {
    font-size: 19px;
    margin: 0 0 3px;
  }

  .container {
    padding: 6px;
  }

  .status {
    margin-bottom: 3px;
  }

  .status div {
    padding: 4px;
    font-size: 12px;
  }

  .timer {
    padding: 4px;
    margin-bottom: 2px;
    font-size: 13px;
  }

  .instruction {
    margin: 2px 0;
    font-size: 12px;
  }

  .category {
    font-size: 20px;
    margin: 1px 0;
  }

  .message {
    min-height: 19px;
    font-size: 13px;
    margin: 1px 0;
  }

  .cards {
    gap: 4px;
    margin: 2px 0 4px;
  }

  .card-name {
    font-size: 12px;
  }

  .change-button {
    padding: 5px 12px;
    font-size: 11px;
  }
}
</style>
</head>

<body>

<h1>なかまえらびゲーム</h1>

<div class="container">

  <!-- 難易度選択 -->

  <section id="startScreen">

    <h2>むずかしさをえらんでね！</h2>

    <p class="level-description">
      どのレベルにちょうせんする？
    </p>

    <div class="level-buttons">

      <button class="level-button" onclick="startGame(1)">
        レベル1<br>
        <small>4まいから 1まい みつけよう</small>
      </button>

      <button class="level-button" onclick="startGame(2)">
        レベル2<br>
        <small>6まいから 2まい みつけよう</small>
      </button>

      <button class="level-button" onclick="startGame(3)">
        レベル3<br>
        <small>9まいから 3まい みつけよう</small>
      </button>

    </div>

  </section>


  <!-- ゲーム画面 -->

  <section id="gameScreen" class="hidden">

    <div class="status">
      <div id="questionStatus">もんだい 1/10</div>
      <div id="scoreStatus">クリア 0</div>
    </div>

    <div class="timer">
      ⏱ タイム：<span id="timerDisplay">00:00</span>
    </div>

    <p class="instruction">
      このなかまはどれかな？
    </p>

    <div class="category" id="categoryName"></div>

    <div class="message" id="message"></div>

    <div class="cards" id="cards"></div>

    <button class="change-button" onclick="backToStart()">
      ← 難易度選択に戻る
    </button>

  </section>


  <!-- 結果画面 -->

  <section id="resultScreen" class="hidden">

    <h2 class="result-title">ゲームおわり！</h2>

    <p>さいごまでよくがんばったね！</p>

    <div class="result-score" id="resultScore"></div>

    <div class="result-time" id="resultTime"></div>

    <button class="restart-button" onclick="backToStart()">
      難易度を選びなおす
    </button>

  </section>

</div>


<script>

/* カードデータ */

const categories = {

  fruits: {
    name: "くだもの",
    audio: "audio/fruits.m4a",
    items: [
      { name: "りんご", image: "apple.png" },
      { name: "ばなな", image: "banana.png" },
      { name: "ぶどう", image: "grapes.png" },
      { name: "いちご", image: "strawberry.png" }
    ]
  },

  animals: {
    name: "どうぶつ",
    audio: "audio/animals.m4a",
    items: [
      { name: "ねこ", image: "cat.png" },
      { name: "いぬ", image: "dog.png" },
      { name: "ぞう", image: "elephant.png" },
      { name: "きりん", image: "giraffe.png" }
    ]
  },

  vehicles: {
    name: "のりもの",
    audio: "audio/vehicles.m4a",
    items: [
      { name: "ひこうき", image: "airplane.png" },
      { name: "ばす", image: "bus.png" },
      { name: "くるま", image: "car.png" },
      { name: "ふね", image: "ship.png" }
    ]
  }

};


/* ゲーム設定 */

let difficulty = 1;
let totalCards = 4;
let requiredCorrect = 1;

let questionNumber = 0;
let score = 0;

let currentCategory = null;
let correctItems = [];
let foundItems = [];
let answeredItems = [];

let currentAudio = null;
let startTime = 0;
let timerInterval = null;
let autoNextTimeout = null;

const totalQuestions = 10;


/* シャッフル */

function shuffle(array) {

  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [result[i], result[j]] = [result[j], result[i]];

  }

  return result;

}


/* 時間表示 */

function formatTime(milliseconds) {

  const seconds = Math.floor(milliseconds / 1000);

  const minutes = Math.floor(seconds / 60);

  const remainingSeconds = seconds % 60;

  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(remainingSeconds).padStart(2, "0")
  );

}


function updateTimer() {

  const elapsed = Date.now() - startTime;

  document.getElementById("timerDisplay").textContent =
    formatTime(elapsed);

}


function startTimer() {

  clearInterval(timerInterval);

  startTime = Date.now();

  updateTimer();

  timerInterval = setInterval(updateTimer, 500);

}


function stopTimer() {

  clearInterval(timerInterval);

  timerInterval = null;

  return Date.now() - startTime;

}


/* 音声 */

function stopAudio() {

  if (currentAudio) {

    currentAudio.pause();

    currentAudio.currentTime = 0;

    currentAudio = null;

  }

}


function playCategoryAudio() {

  if (!currentCategory) return;

  stopAudio();

  currentAudio = new Audio(currentCategory.audio);

  currentAudio.play().catch(() => {
    // iPhoneなどで自動再生が制限された場合は再生できないことがあります
  });

}


/* 難易度選択 */

function startGame(level) {

  stopAudio();

  clearInterval(timerInterval);

  clearTimeout(autoNextTimeout);

  difficulty = level;

  if (level === 1) {

    totalCards = 4;

    requiredCorrect = 1;

  } else if (level === 2) {

    totalCards = 6;

    requiredCorrect = 2;

  } else {

    totalCards = 9;

    requiredCorrect = 3;

  }

  questionNumber = 0;

  score = 0;

  document.getElementById("startScreen").classList.add("hidden");

  document.getElementById("resultScreen").classList.add("hidden");

  document.getElementById("gameScreen").classList.remove("hidden");

  startTimer();

  nextQuestion();

}


/* 難易度選択に戻る */

function backToStart() {

  stopAudio();

  clearInterval(timerInterval);

  clearTimeout(autoNextTimeout);

  document.getElementById("gameScreen").classList.add("hidden");

  document.getElementById("resultScreen").classList.add("hidden");

  document.getElementById("startScreen").classList.remove("hidden");

  questionNumber = 0;

  score = 0;

}


/* 次の問題 */

function nextQuestion() {

  stopAudio();

  clearTimeout(autoNextTimeout);

  if (questionNumber >= totalQuestions) {

    showResult();

    return;

  }

  questionNumber++;

  foundItems = [];

  answeredItems = [];

  const keys = Object.keys(categories);

  const randomKey =
    keys[Math.floor(Math.random() * keys.length)];

  currentCategory = categories[randomKey];


  /* 正解カードを選ぶ */

  correctItems = shuffle(currentCategory.items)
    .slice(0, requiredCorrect);


  /* 不正解カードを選ぶ */

  const otherItems = [];

  keys.forEach(key => {

    if (key !== randomKey) {

      otherItems.push(...categories[key].items);

    }

  });

  const wrongCount = totalCards - requiredCorrect;

  const wrongItems = shuffle(otherItems)
    .slice(0, wrongCount);


  /* カードを混ぜる */

  const allCards = shuffle([
    ...correctItems,
    ...wrongItems
  ]);


  /* 画面表示 */

  document.getElementById("questionStatus").textContent =
    `もんだい ${questionNumber}/${totalQuestions}`;

  document.getElementById("scoreStatus").textContent =
    `クリア ${score}`;

  document.getElementById("categoryName").textContent =
    currentCategory.name;

  const message = document.getElementById("message");

  message.textContent = "";

  message.className = "message";


  /* 難易度ごとのカード配置 */

  const cardsArea = document.getElementById("cards");

  cardsArea.innerHTML = "";

  cardsArea.className = "cards level" + difficulty;


  /* カード作成 */

  allCards.forEach(item => {

    const card = document.createElement("button");

    card.className = "card";

    card.innerHTML = `
      <img src="images/${item.image}" alt="${item.name}">
      <div class="card-name">${item.name}</div>
    `;

    card.onclick = () => checkAnswer(card, item);

    cardsArea.appendChild(card);

  });


  /* カテゴリー音声を再生 */

  playCategoryAudio();

}


/* 答え合わせ */

function checkAnswer(card, item) {

  if (answeredItems.includes(item)) return;

  if (foundItems.length === requiredCorrect) return;

  answeredItems.push(item);

  const message = document.getElementById("message");


  /* 正解 */

  if (correctItems.includes(item)) {

    foundItems.push(item);

    card.classList.add("correct");

    card.disabled = true;

    message.textContent = "○ せいかい！";

    message.className = "message correct";


    /* 全問正解した場合 */

    if (foundItems.length === requiredCorrect) {

      score++;

      document.getElementById("scoreStatus").textContent =
        `クリア ${score}`;

      message.textContent = "○ ぜんぶみつけたね！";

      autoNextTimeout = setTimeout(() => {

        nextQuestion();

      }, 800);

    }

  } else {

    /* 不正解 */

    card.classList.add("wrong");

    card.disabled = true;

    message.textContent = "× ちがうよ！";

    message.className = "message wrong";

  }

}


/* 結果画面 */

function showResult() {

  stopAudio();

  const finalTime = stopTimer();

  document.getElementById("gameScreen").classList.add("hidden");

  document.getElementById("resultScreen").classList.remove("hidden");

  document.getElementById("resultScore").textContent =
    `${totalQuestions}問中 ${score}問クリア！`;

  document.getElementById("resultTime").textContent =
    `かかった時間：${formatTime(finalTime)}`;

}

</script>

</body>
</html>
