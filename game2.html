
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>なかまわけゲーム</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:16px;
  font-family:Arial,"Hiragino Kaku Gothic ProN",sans-serif;
  background:#fff8ec;color:#444;text-align:center;
}
.container{max-width:720px;margin:auto}
h1{color:#e78343;font-size:26px}
.panel{
  background:#fff;border-radius:20px;
  padding:18px 14px;margin-bottom:16px;
  box-shadow:0 3px 10px #00000012;
}
button{font:inherit;cursor:pointer;border:0}
.start-button,.action-button{
  background:#f3a45d;color:#fff;
  font-size:19px;font-weight:bold;
  padding:15px 30px;border-radius:14px;
}
.level-grid{display:grid;gap:12px;margin-top:18px}
.level-button{
  padding:17px 12px;border:3px solid #f3d2ae;
  background:#fff9f1;border-radius:16px;color:#555;
}
.level-button strong{display:block;font-size:21px;margin-bottom:5px}
.level-button span{font-size:15px}
.level-button:active{background:#ffe7ca}
.info{
  display:flex;gap:8px;justify-content:space-between;
  margin-bottom:14px;
}
.info div{
  flex:1;background:#fff1df;border-radius:10px;
  padding:9px 4px;font-size:14px;font-weight:bold;
}
.category{
  font-size:32px;font-weight:bold;
  color:#e78343;margin:12px 0;
}
.message{
  min-height:36px;font-size:22px;
  font-weight:bold;margin:12px 0;
}
.card-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.card{
  background:#fff4e5;border:3px solid transparent;
  border-radius:16px;padding:8px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:155px;
}
.card img{
  width:100%;height:110px;object-fit:contain;
}
.card .word{font-size:18px;font-weight:bold;margin-top:5px}
.card.correct{background:#eaffea;border-color:#43ad55}
.card.incorrect{background:#ffeded;border-color:#d9534f}
.card:disabled{cursor:default;opacity:1}
.hidden{display:none!important}
.audio-status{font-size:13px;color:#777;margin:8px}
.replay-button{
  background:#fff0df;color:#a85b24;
  border:1px solid #f0c49e;border-radius:20px;
  padding:8px 15px;font-size:14px;
}
.progress{
  font-size:15px;color:#777;margin:10px 0;
}
@media(min-width:600px){
  .card-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .card{min-height:180px}
  .card img{height:125px}
}
</style>
</head>
<body>
<div class="container">
  <h1>なかまわけゲーム</h1>

  <!-- 難易度選択 -->
  <div class="panel" id="startPanel">
    <p>どのレベルにチャレンジする？</p>
    <div class="level-grid">
      <button class="level-button" onclick="startGame(1)">
        <strong>🌱 レベル1・かんたん</strong>
        <span>4枚の中から1枚選ぼう！</span>
      </button>
      <button class="level-button" onclick="startGame(2)">
        <strong>🌼 レベル2・ふつう</strong>
        <span>6枚の中から2枚選ぼう！</span>
      </button>
      <button class="level-button" onclick="startGame(3)">
        <strong>🌟 レベル3・むずかしい</strong>
        <span>9枚の中から3枚選ぼう！</span>
      </button>
    </div>
  </div>

  <!-- ゲーム画面 -->
  <div class="panel hidden" id="gamePanel">
    <div class="info">
      <div>もんだい <span id="count">1</span>/10</div>
      <div>クリア <span id="score">0</span></div>
    </div>

    <p>このなかまはどれかな？</p>
    <div class="category" id="category"></div>

    <div class="audio-status" id="audioStatus">カテゴリーの音声を再生します</div>
    <button class="replay-button" onclick="playCategoryAudio()">🔊 もういちど聞く</button>

    <div class="progress" id="progress"></div>
    <div class="message" id="message"></div>
    <div class="card-grid" id="choices"></div>

    <button class="action-button hidden" id="nextButton" onclick="nextQuestion()">
      つぎのもんだい
    </button>
  </div>

  <!-- 結果画面 -->
  <div class="panel hidden" id="resultPanel">
    <h2>おしまい！</h2>
    <p id="resultText"></p>
    <button class="start-button" onclick="backToStart()">もういちどあそぶ</button>
  </div>
</div>

<script>
const categories = [
  {
    name:"くだもの",
    audio:"audio/fruits.m4a",
    items:[
      {name:"りんご",image:"images/apple.png"},
      {name:"バナナ",image:"images/banana.png"},
      {name:"ぶどう",image:"images/grapes.png"},
      {name:"いちご",image:"images/strawberry.png"}
    ]
  },
  {
    name:"どうぶつ",
    audio:"audio/animals.m4a",
    items:[
      {name:"ねこ",image:"images/cat.png"},
      {name:"いぬ",image:"images/dog.png"},
      {name:"ぞう",image:"images/elephant.png"},
      {name:"きりん",image:"images/giraffe.png"}
    ]
  },
  {
    name:"のりもの",
    audio:"audio/vehicles.m4a",
    items:[
      {name:"ひこうき",image:"images/airplane.png"},
      {name:"バス",image:"images/bus.png"},
      {name:"くるま",image:"images/car.png"},
      {name:"ふね",image:"images/ship.png"}
    ]
  }
];

let questionNumber=0;
let score=0;
let currentCategory=null;
let answered=false;
let categorySound=null;
let currentLevel=1;
let correctItems=[];
let foundItems=[];
let totalCards=4;
let requiredCorrect=1;

const totalQuestions=10;

function backToStart(){
  stopCategoryAudio();
  document.getElementById("gamePanel").classList.add("hidden");
  document.getElementById("resultPanel").classList.add("hidden");
  document.getElementById("startPanel").classList.remove("hidden");
}

function stopCategoryAudio(){
  if(categorySound){
    categorySound.pause();
    categorySound.currentTime=0;
    categorySound=null;
  }
}

function startGame(level){
  currentLevel=level;

  if(level===1){
    totalCards=4;
    requiredCorrect=1;
  }else if(level===2){
    totalCards=6;
    requiredCorrect=2;
  }else{
    totalCards=9;
    requiredCorrect=3;
  }

  questionNumber=0;
  score=0;

  document.getElementById("startPanel").classList.add("hidden");
  document.getElementById("resultPanel").classList.add("hidden");
  document.getElementById("gamePanel").classList.remove("hidden");

  nextQuestion();
}

function shuffle(array){
  const result=[...array];
  for(let i=result.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [result[i],result[j]]=[result[j],result[i]];
  }
  return result;
}

function playCategoryAudio(){
  if(!currentCategory)return;

  stopCategoryAudio();

  categorySound=new Audio(currentCategory.audio);
  categorySound.play().then(()=>{
    document.getElementById("audioStatus").textContent="カテゴリーの音声を再生中";
  }).catch(()=>{
    document.getElementById("audioStatus").textContent=
      "音声を再生できません。もういちど聞くを押してください。";
  });
}

function nextQuestion(){
  if(questionNumber>=totalQuestions){
    showResult();
    return;
  }

  stopCategoryAudio();

  questionNumber++;
  answered=false;
  foundItems=[];

  document.getElementById("count").textContent=questionNumber;
  document.getElementById("score").textContent=score;
  document.getElementById("message").textContent="";
  document.getElementById("nextButton").classList.add("hidden");

  currentCategory=categories[
    Math.floor(Math.random()*categories.length)
  ];

  document.getElementById("category").textContent=currentCategory.name;

  // 正解カードを必要枚数選ぶ
  correctItems=shuffle(currentCategory.items).slice(0,requiredCorrect);

  // ほかのカテゴリーから不正解カードを選ぶ
  const wrongItems=categories
    .filter(c=>c!==currentCategory)
    .flatMap(c=>c.items);

  const selectedWrong=shuffle(wrongItems).slice(
    0,totalCards-requiredCorrect
  );

  // 正解と不正解を混ぜる
  const choices=shuffle([...correctItems,...selectedWrong]);

  const choiceArea=document.getElementById("choices");
  choiceArea.innerHTML="";

  choices.forEach(item=>{
    const button=document.createElement("button");
    button.className="card";

    const img=document.createElement("img");
    img.src=item.image;
    img.alt=item.name;

    const word=document.createElement("span");
    word.className="word";
    word.textContent=item.name;

    button.appendChild(img);
    button.appendChild(word);

    button.onclick=()=>checkAnswer(button,item);
    choiceArea.appendChild(button);
  });

  updateProgress();

  // 問題表示時にカテゴリー音声だけを再生
  playCategoryAudio();
}

function updateProgress(){
  document.getElementById("progress").textContent=
    "みつけた数："+foundItems.length+" / "+requiredCorrect;
}

function checkAnswer(button,item){
  if(button.disabled || answered)return;

  if(correctItems.includes(item)){
    button.classList.add("correct");
    button.disabled=true;
    foundItems.push(item);

    document.getElementById("message").textContent="○ せいかい！";
    document.getElementById("message").style.color="#269b4a";

    updateProgress();

    if(foundItems.length===requiredCorrect){
      answered=true;
      score++;
      document.getElementById("score").textContent=score;

      document.getElementById("message").textContent=
        "○ ぜんぶみつけたね！";
      document.getElementById("nextButton").classList.remove("hidden");
    }
  }else{
    button.classList.add("incorrect");
    button.disabled=true;

    document.getElementById("message").textContent=
      "× ちがうよ。ほかをさがしてみよう！";
    document.getElementById("message").style.color="#d9534f";
  }
}

function showResult(){
  stopCategoryAudio();

  document.getElementById("gamePanel").classList.add("hidden");
  document.getElementById("resultPanel").classList.remove("hidden");

  document.getElementById("resultText").textContent=
    totalQuestions+"もん中 "+score+"もん クリア！";
}
</script>
</body>
</html>
