/* =====================================
   効果音の準備
===================================== */

let audioContext = null;

// iPhone/SafariではAudioContextの再開完了を待ってから音を鳴らす
function initAudio() {
  const AudioContextClass =
    window.AudioContext || window.webkitAudioContext;

  if (!AudioContextClass) return Promise.resolve(false);

  try {
    if (!audioContext || audioContext.state === "closed") {
      audioContext = new AudioContextClass();
    }

    if (audioContext.state === "running") {
      return Promise.resolve(true);
    }

    return audioContext.resume().then(() => {
      return audioContext.state === "running";
    }).catch(() => false);

  } catch (error) {
    return Promise.resolve(false);
  }
}

// 音を鳴らす共通処理
function playTone(frequency, startTime, duration, volume, type = "sine") {
  if (!audioContext || audioContext.state !== "running") return;

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = type;
  oscillator.frequency.setValueAtTime(frequency, startTime);

  gain.gain.setValueAtTime(0.001, startTime);
  gain.gain.exponentialRampToValueAtTime(
    volume,
    startTime + 0.02
  );
  gain.gain.exponentialRampToValueAtTime(
    0.001,
    startTime + duration
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start(startTime);
  oscillator.stop(startTime + duration + 0.03);
}

// 音声再開が完了してから、指定した音を順番に鳴らす
function playSoundSequence(notes) {
  initAudio().then((ready) => {
    if (!ready || !audioContext || audioContext.state !== "running") {
      return;
    }

    const now = audioContext.currentTime;

    notes.forEach(note => {
      playTone(
        note.frequency,
        now + note.delay,
        note.duration,
        note.volume,
        note.type || "sine"
      );
    });
  });
}

// 正解音：ピンポーン♪
function playCorrectSound() {
  playSoundSequence([
    { frequency: 880, delay: 0, duration: 0.22, volume: 0.22 },
    { frequency: 1175, delay: 0.18, duration: 0.35, volume: 0.22 }
  ]);
}

// 不正解音：ブッブー！
function playWrongSound() {
  playSoundSequence([
    { frequency: 180, delay: 0, duration: 0.35, volume: 0.24, type: "sawtooth" },
    { frequency: 145, delay: 0.25, duration: 0.45, volume: 0.24, type: "sawtooth" }
  ]);
}

// クリア音：明るいチャイム
function playClearSound() {
  playSoundSequence([
    { frequency: 784, delay: 0, duration: 0.25, volume: 0.22 },
    { frequency: 988, delay: 0.18, duration: 0.25, volume: 0.22 },
    { frequency: 1175, delay: 0.36, duration: 0.25, volume: 0.22 },
    { frequency: 1568, delay: 0.54, duration: 0.55, volume: 0.22 }
  ]);
}

// クリアー！と声で知らせる
function speakClear() {
  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance("クリアー！");
  utterance.lang = "ja-JP";
  utterance.rate = 0.9;
  utterance.pitch = 1.2;

  // iOSで一時停止状態になっている場合に備える
  if (typeof window.speechSynthesis.resume === "function") {
    window.speechSynthesis.resume();
  }

  window.speechSynthesis.speak(utterance);
}

/* =====================================
   ゲーム設定
===================================== */

const QUESTION_TOTAL = 10;

const levelSettings = {
  1: { boardSize: 8, correctCount: 4 },
  2: { boardSize: 12, correctCount: 4 },
  3: { boardSize: 16, correctCount: 4 }
};

let currentLevel = 1;
let questionIndex = 0;
let score = 0;
let selectedCards = [];
let currentCorrectCards = [];
let startTime = 0;
let timerInterval = null;
let gameLocked = false;
let elapsedSeconds = 0;


/* =====================================
   共通処理
===================================== */

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function formatTime(seconds) {
  const minutes = Math.floor(seconds / 60);
  const secs = seconds % 60;

  return String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0");
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "ja-JP";
  utterance.rate = 0.85;

  window.speechSynthesis.speak(utterance);
}

function updateTimer() {
  elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);

  document.getElementById("timer").textContent =
    formatTime(elapsedSeconds);
}


/* =====================================
   ゲーム開始
===================================== */

function startGame(level) {

  // iPhoneの音声機能を開始
  initAudio();

  currentLevel = level;
  questionIndex = 0;
  score = 0;
  elapsedSeconds = 0;
  selectedCards = [];
  currentCorrectCards = [];
  gameLocked = false;

  clearInterval(timerInterval);

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");

  document.getElementById("score").textContent = "0";
  document.getElementById("timer").textContent = "00:00";

  startTime = Date.now();

  timerInterval = setInterval(updateTimer, 500);

  nextQuestion();
}


/* =====================================
   次の問題を作る
===================================== */

function nextQuestion() {

  if (questionIndex >= QUESTION_TOTAL) {
    finishGame();
    return;
  }

  gameLocked = false;
  selectedCards = [];

  const levelCategories = categoryLevels[currentLevel];
  const settings = levelSettings[currentLevel];

  const availableCategories = levelCategories.filter(category => {
    return cards.filter(card =>
      card.categories.includes(category)
    ).length >= settings.correctCount;
  });

  if (availableCategories.length === 0) {
    alert("出題できるカテゴリーがありません。");
    backToStart();
    return;
  }

  const category = shuffle(availableCategories)[0];

  // 正解カード
  const correctPool = cards.filter(card =>
    card.categories.includes(category)
  );

  currentCorrectCards = shuffle(correctPool)
    .slice(0, settings.correctCount);

  // 不正解カード
  const correctSet = new Set(currentCorrectCards);

  const wrongPool = cards.filter(card =>
    !card.categories.includes(category) &&
    !correctSet.has(card)
  );

  const wrongCount = settings.boardSize - settings.correctCount;

  const wrongCards = shuffle(wrongPool).slice(0, wrongCount);

  const board = shuffle([
    ...currentCorrectCards,
    ...wrongCards
  ]);

  document.getElementById("questionCount").textContent =
    (questionIndex + 1) + " / " + QUESTION_TOTAL;

  document.getElementById("category").textContent = category;
  document.getElementById("message").textContent = "";
  document.getElementById("score").textContent = score;

  renderCards(board);

  speak(category);
}


/* =====================================
   カード表示
===================================== */

function renderCards(board) {

  const grid = document.getElementById("cardGrid");

  grid.innerHTML = "";

  board.forEach(card => {

    const button = document.createElement("button");

    button.className = "card";

    button.innerHTML = `
      <span class="emoji">${card.emoji}</span>
      <span class="word">${card.name}</span>
    `;

    button.onclick = () => selectCard(card, button);

    grid.appendChild(button);
  });
}


/* =====================================
   カード選択
===================================== */

function selectCard(card, button) {

  if (gameLocked) return;

  if (button.classList.contains("selected")) return;

  const isCorrect = card.categories.includes(
    document.getElementById("category").textContent
  );

  if (!isCorrect) {
    restartAfterMistake();
    return;
  }

  // 正解音
  playCorrectSound();

  // 正解カードを選択
  button.classList.add("selected");
  button.disabled = true;

  selectedCards.push(card);

  // すべての正解を選んだか確認
  if (selectedCards.length === currentCorrectCards.length) {

    gameLocked = true;

    score++;

    document.getElementById("score").textContent = score;
    document.getElementById("message").textContent = "せいかい！";

    questionIndex++;

    setTimeout(() => {
      nextQuestion();
    }, 800);
  }
}


/* =====================================
   間違えた場合
===================================== */

function restartAfterMistake() {

  if (gameLocked) return;

  gameLocked = true;

  // 不正解音
  playWrongSound();

  clearInterval(timerInterval);

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  document.getElementById("message").textContent =
    "もういちど はじめから！";

  const buttons = document.querySelectorAll(".card");

  buttons.forEach(button => {
    button.disabled = true;
  });

  setTimeout(() => {
    startGame(currentLevel);
  }, 1200);
}


/* =====================================
   ゲーム終了
===================================== */

function finishGame() {

  clearInterval(timerInterval);
  updateTimer();

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.remove("hidden");

  document.getElementById("resultScore").textContent =
    "せいかい " + score + " / " + QUESTION_TOTAL + " もん";

  document.getElementById("resultTime").textContent =
    formatTime(elapsedSeconds);

  // クリア音と「クリアー！」の音声
  playClearSound();

  setTimeout(() => {
    speakClear();
  }, 850);
}


/* =====================================
   結果コピー
===================================== */

function copyResults() {

  const text =
    "なかまわけゲーム\n" +
    "レベル：" + ["", "初級", "中級", "上級"][currentLevel] + "\n" +
    "せいかい：" + score + " / " + QUESTION_TOTAL + "\n" +
    "じかん：" + formatTime(elapsedSeconds);

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text)
      .then(() => alert("結果をコピーしました！"))
      .catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {

  const textarea = document.createElement("textarea");

  textarea.value = text;
  textarea.style.position = "fixed";
  textarea.style.left = "-9999px";

  document.body.appendChild(textarea);

  textarea.select();

  try {
    document.execCommand("copy");
    alert("結果をコピーしました！");
  } catch (error) {
    alert("コピーできませんでした。");
  }

  textarea.remove();
}


/* =====================================
   レベル選択へ戻る
===================================== */

function backToStart() {

  clearInterval(timerInterval);

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.add("hidden");
  document.getElementById("startScreen").classList.remove("hidden");
}

</script>
