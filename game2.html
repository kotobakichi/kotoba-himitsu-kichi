
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>なかまわけゲーム</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:16px;
  font-family:Arial,"Hiragino Kaku Gothic ProN",sans-serif;
  background:#fff8ec;color:#444;text-align:center;
}
.container{max-width:720px;margin:auto}
h1{color:#e78343;font-size:26px}
.panel{
  background:#fff;border-radius:20px;
  padding:18px 14px;margin-bottom:16px;
  box-shadow:0 3px 10px #00000012;
}
button{font:inherit;cursor:pointer;border:0}
.start-button,.action-button{
  background:#f3a45d;color:#fff;
  font-size:19px;font-weight:bold;
  padding:15px 30px;border-radius:14px;
}
.info{
  display:flex;gap:8px;justify-content:space-between;
  margin-bottom:14px;
}
.info div{
  flex:1;background:#fff1df;border-radius:10px;
  padding:9px 4px;font-size:14px;font-weight:bold;
}
.category{
  font-size:32px;font-weight:bold;
  color:#e78343;margin:12px 0;
}
.message{
  min-height:36px;font-size:22px;
  font-weight:bold;margin:12px 0;
}
.card-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.card{
  background:#fff4e5;border:3px solid transparent;
  border-radius:16px;padding:8px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:155px;
}
.card img{
  width:100%;height:110px;object-fit:contain;
}
.card .word{font-size:18px;font-weight:bold;margin-top:5px}
.card.correct{background:#eaffea;border-color:#43ad55}
.card.incorrect{background:#ffeded;border-color:#d9534f}
.card:disabled{cursor:default;opacity:1}
.hidden{display:none!important}
.audio-status{font-size:13px;color:#777;margin:8px}
.replay-button{
  background:#fff0df;color:#a85b24;
  border:1px solid #f0c49e;border-radius:20px;
  padding:8px 15px;font-size:14px;
}
@media(min-width:600px){
  .card-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .card{min-height:180px}
  .card img{height:125px}
}
</style>
</head>
<body>
<div class="container">
  <h1>なかまわけゲーム</h1>

  <div class="panel" id="startPanel">
    <p>なかまのカテゴリーを見て、あてはまるものを選ぼう！</p>
    <button class="start-button" onclick="startGame()">ゲームスタート</button>
  </div>

  <div class="panel hidden" id="gamePanel">
    <div class="info">
      <div>もんだい <span id="count">1</span></div>
      <div>せいかい <span id="score">0</span></div>
    </div>

    <p>このなかまはどれかな？</p>
    <div class="category" id="category"></div>

    <div class="audio-status" id="audioStatus">カテゴリーの音声を再生します</div>
    <button class="replay-button" onclick="playCategoryAudio()">🔊 もういちど聞く</button>

    <div class="message" id="message"></div>
    <div class="card-grid" id="choices"></div>

    <button class="action-button hidden" id="nextButton" onclick="nextQuestion()">
      つぎのもんだい
    </button>
  </div>

  <div class="panel hidden" id="resultPanel">
    <h2>おしまい！</h2>
    <p id="resultText"></p>
    <button class="start-button" onclick="startGame()">もういちどあそぶ</button>
  </div>
</div>

<script>
const categories = [
  {
    name:"くだもの",
    audio:"audio/fruits.m4a",
    items:[
      {name:"りんご",image:"images/apple.png"},
      {name:"バナナ",image:"images/banana.png"},
      {name:"ぶどう",image:"images/grapes.png"},
      {name:"いちご",image:"images/strawberry.png"}
    ]
  },
  {
    name:"どうぶつ",
    audio:"audio/animals.m4a",
    items:[
      {name:"ねこ",image:"images/cat.png"},
      {name:"いぬ",image:"images/dog.png"},
      {name:"ぞう",image:"images/elephant.png"},
      {name:"きりん",image:"images/giraffe.png"}
    ]
  },
  {
    name:"のりもの",
    audio:"audio/vehicles.m4a",
    items:[
      {name:"ひこうき",image:"images/airplane.png"},
      {name:"バス",image:"images/bus.png"},
      {name:"くるま",image:"images/car.png"},
      {name:"ふね",image:"images/ship.png"}
    ]
  }
];

let questionNumber=0;
let score=0;
let currentCategory=null;
let answered=false;
let categorySound=null;

const totalQuestions=10;

function startGame(){
  questionNumber=0;
  score=0;
  document.getElementById("startPanel").classList.add("hidden");
  document.getElementById("resultPanel").classList.add("hidden");
  document.getElementById("gamePanel").classList.remove("hidden");
  nextQuestion();
}

function playCategoryAudio(){
  if(!currentCategory)return;

  if(categorySound){
    categorySound.pause();
    categorySound.currentTime=0;
  }

  categorySound=new Audio(currentCategory.audio);
  categorySound.play().then(()=>{
    document.getElementById("audioStatus").textContent="カテゴリーの音声を再生中";
  }).catch(()=>{
    document.getElementById("audioStatus").textContent=
      "音声を再生できません。ボタンでもう一度お試しください。";
  });
}

function nextQuestion(){
  if(questionNumber>=totalQuestions){
    showResult();
    return;
  }

  questionNumber++;
  answered=false;

  document.getElementById("count").textContent=questionNumber;
  document.getElementById("score").textContent=score;
  document.getElementById("message").textContent="";
  document.getElementById("nextButton").classList.add("hidden");

  currentCategory=categories[Math.floor(Math.random()*categories.length)];
  document.getElementById("category").textContent=currentCategory.name;

  const otherCategories=categories.filter(c=>c!==currentCategory);
  const correctItem=currentCategory.items[
    Math.floor(Math.random()*currentCategory.items.length)
  ];

  const wrongItems=otherCategories.flatMap(c=>c.items);
  const choices=[correctItem];

  while(choices.length<4){
    const item=wrongItems[Math.floor(Math.random()*wrongItems.length)];
    if(!choices.includes(item))choices.push(item);
  }

  for(let i=choices.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [choices[i],choices[j]]=[choices[j],choices[i]];
  }

  const choiceArea=document.getElementById("choices");
  choiceArea.innerHTML="";

  choices.forEach(item=>{
    const button=document.createElement("button");
    button.className="card";
    button.innerHTML=
      `<img src="${item.image}" alt="${item.name}">
       <span class="word">${item.name}</span>`;
    button.onclick=()=>checkAnswer(button,item,correctItem);
    choiceArea.appendChild(button);
  });

  // 問題が表示されたタイミングでカテゴリー音声だけを再生
  playCategoryAudio();
}

function checkAnswer(button,item,correctItem){
  if(answered)return;
  answered=true;

  const buttons=document.querySelectorAll(".card");
  buttons.forEach(b=>b.disabled=true);

  if(item===correctItem){
    button.classList.add("correct");
    document.getElementById("message").textContent="○ せいかい！";
    document.getElementById("message").style.color="#269b4a";
    score++;
    document.getElementById("score").textContent=score;
  }else{
    button.classList.add("incorrect");
    document.getElementById("message").textContent="× もういちどがんばろう！";
    document.getElementById("message").style.color="#d9534f";

    buttons.forEach(b=>{
      const img=b.querySelector("img");
      if(img && img.getAttribute("src")===correctItem.image){
        b.classList.add("correct");
      }
    });
  }

  document.getElementById("nextButton").classList.remove("hidden");
}

function showResult(){
  document.getElementById("gamePanel").classList.add("hidden");
  document.getElementById("resultPanel").classList.remove("hidden");
  document.getElementById("resultText").textContent=
    totalQuestions+"もん中 "+score+"もん せいかい！";
}
</script>
</body>
</html>
