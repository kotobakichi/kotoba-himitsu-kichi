
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>なかまわけゲーム</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 12px;
  background: #fff8ed;
  font-family: sans-serif;
  text-align: center;
  color: #333;
}

h1 {
  color: #f28a45;
  margin: 5px 0 20px;
  font-size: 28px;
}

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 18px 14px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  font-weight: bold;
}

.hidden {
  display: none !important;
}

/* 難易度選択画面 */

.level-description {
  font-size: 16px;
  margin: 15px 0 25px;
  line-height: 1.8;
}

.level-buttons {
  display: flex;
  flex-direction: column;
  gap: 14px;
  max-width: 400px;
  margin: 0 auto;
}

.level-button {
  padding: 18px;
  border-radius: 15px;
  background: #fff0df;
  color: #333;
  font-size: 19px;
  border: 2px solid #ffd5ad;
}

.level-button:hover {
  background: #ffe2c4;
}

/* ゲーム画面 */

.status {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 20px;
}

.status div {
  background: #fff0df;
  padding: 12px 5px;
  border-radius: 12px;
  font-weight: bold;
}

.instruction {
  font-size: 17px;
  margin: 15px 0;
}

.category {
  color: #f28a45;
  font-size: 30px;
  font-weight: bold;
  margin: 20px 0 10px;
}

.audio-status {
  font-size: 13px;
  color: #888;
  margin: 10px 0;
}

.replay-button {
  background: #fff0df;
  color: #c66c31;
  border: 1px solid #ffbd8b;
  border-radius: 25px;
  padding: 10px 18px;
  font-size: 14px;
}

.progress {
  margin: 12px 0;
  color: #666;
  font-size: 15px;
}

.message {
  min-height: 38px;
  font-size: 20px;
  font-weight: bold;
  margin: 12px 0;
}

.message.correct {
  color: #20a34a;
}

.message.wrong {
  color: #e34b4b;
}

/* カード：常に2列 */

.cards {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin: 15px 0;
}

.card {
  background: #fff2e2;
  border: 3px solid transparent;
  border-radius: 17px;
  padding: 10px 5px;
  min-width: 0;
  transition: 0.2s;
}

.card img {
  width: 100%;
  max-width: 125px;
  height: 125px;
  object-fit: contain;
  background: white;
  display: block;
  margin: 0 auto 8px;
}

.card-name {
  font-size: 18px;
  font-weight: bold;
  color: #111;
}

.card.correct {
  background: #e9ffeb;
  border-color: #39b653;
  opacity: 0.65;
}

.card.wrong {
  background: #ffe8e8;
  border-color: #e34b4b;
  opacity: 0.65;
}

.card:disabled {
  cursor: default;
}

.next-button {
  display: block;
  margin: 15px auto 10px;
  padding: 17px 30px;
  border-radius: 15px;
  background: #f5a052;
  color: white;
  font-size: 18px;
}

.change-button {
  margin: 15px auto 5px;
  padding: 11px 20px;
  border-radius: 25px;
  background: #eee;
  color: #555;
  font-size: 14px;
}

/* 結果画面 */

.result-title {
  color: #f28a45;
  font-size: 28px;
}

.result-score {
  font-size: 24px;
  font-weight: bold;
  margin: 25px 0;
}

.restart-button {
  background: #f5a052;
  color: white;
  border-radius: 15px;
  padding: 16px 25px;
  font-size: 18px;
}

@media (max-width: 380px) {
  .card img {
    height: 105px;
  }

  .card-name {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<h1>なかまわけゲーム</h1>

<div class="container">

  <!-- 難易度選択画面 -->
  <section id="startScreen">
    <h2>むずかしさをえらんでね！</h2>

    <p class="level-description">
      どのレベルにちょうせんする？
    </p>

    <div class="level-buttons">
      <button class="level-button" onclick="startGame(1)">
        レベル1<br>
        <small>4まいから 1まい みつけよう</small>
      </button>

      <button class="level-button" onclick="startGame(2)">
        レベル2<br>
        <small>6まいから 2まい みつけよう</small>
      </button>

      <button class="level-button" onclick="startGame(3)">
        レベル3<br>
        <small>9まいから 3まい みつけよう</small>
      </button>
    </div>
  </section>

  <!-- ゲーム画面 -->
  <section id="gameScreen" class="hidden">

    <div class="status">
      <div id="questionStatus">もんだい 1/10</div>
      <div id="scoreStatus">クリア 0</div>
    </div>

    <p class="instruction">このなかまはどれかな？</p>

    <div class="category" id="categoryName"></div>

    <div class="audio-status" id="audioStatus">
      カテゴリーの音声を再生中
    </div>

    <button class="replay-button" onclick="playCategoryAudio()">
      🔊 もういちど聞く
    </button>

    <div class="progress" id="progress">
      みつけた数：0 / 1
    </div>

    <div class="message" id="message"></div>

    <div class="cards" id="cards"></div>

    <button id="nextButton" class="next-button hidden"
      onclick="nextQuestion()">
      つぎのもんだい
    </button>

    <button class="change-button" onclick="backToStart()">
      難易度を変更
    </button>

  </section>

  <!-- 結果画面 -->
  <section id="resultScreen" class="hidden">
    <h2 class="result-title">ゲームおわり！</h2>

    <p>さいごまでよくがんばったね！</p>

    <div class="result-score" id="resultScore"></div>

    <button class="restart-button" onclick="backToStart()">
      難易度を選びなおす
    </button>
  </section>

</div>

<script>

/* カードのデータ */

const categories = {
  fruits: {
    name: "くだもの",
    audio: "audio/fruits.m4a",
    items: [
      { name: "りんご", image: "apple.png" },
      { name: "ばなな", image: "banana.png" },
      { name: "ぶどう", image: "grapes.png" },
      { name: "いちご", image: "strawberry.png" }
    ]
  },

  animals: {
    name: "どうぶつ",
    audio: "audio/animals.m4a",
    items: [
      { name: "ねこ", image: "cat.png" },
      { name: "いぬ", image: "dog.png" },
      { name: "ぞう", image: "elephant.png" },
      { name: "きりん", image: "giraffe.png" }
    ]
  },

  vehicles: {
    name: "のりもの",
    audio: "audio/vehicles.m4a",
    items: [
      { name: "ひこうき", image: "airplane.png" },
      { name: "ばす", image: "bus.png" },
      { name: "くるま", image: "car.png" },
      { name: "ふね", image: "ship.png" }
    ]
  }
};

/* ゲームの設定 */

let difficulty = 1;
let totalCards = 4;
let requiredCorrect = 1;

let questionNumber = 0;
let score = 0;

let currentCategory = null;
let correctItems = [];
let foundItems = [];
let answeredItems = [];

let currentAudio = null;

const totalQuestions = 10;

/* 配列をシャッフル */

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));

    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

/* 難易度選択 */

function startGame(level) {

  difficulty = level;

  if (level === 1) {
    totalCards = 4;
    requiredCorrect = 1;
  } else if (level === 2) {
    totalCards = 6;
    requiredCorrect = 2;
  } else {
    totalCards = 9;
    requiredCorrect = 3;
  }

  questionNumber = 0;
  score = 0;

  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");

  nextQuestion();
}

/* 最初の画面に戻る */

function backToStart() {

  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }

  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.add("hidden");
  document.getElementById("startScreen").classList.remove("hidden");

  questionNumber = 0;
  score = 0;
}

/* 次の問題 */

function nextQuestion() {

  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }

  if (questionNumber >= totalQuestions) {
    showResult();
    return;
  }

  questionNumber++;

  foundItems = [];
  answeredItems = [];

  const keys = Object.keys(categories);

  const randomKey = keys[Math.floor(Math.random() * keys.length)];

  currentCategory = categories[randomKey];

  /* 正解カードを選ぶ */

  correctItems = shuffle(currentCategory.items)
    .slice(0, requiredCorrect);

  /* まちがいカードを選ぶ */

  const otherItems = [];

  keys.forEach(key => {
    if (key !== randomKey) {
      otherItems.push(...categories[key].items);
    }
  });

  const wrongCount = totalCards - requiredCorrect;

  const wrongItems = shuffle(otherItems)
    .slice(0, wrongCount);

  /* カードを混ぜる */

  const allCards = shuffle([
    ...correctItems,
    ...wrongItems
  ]);

  /* 画面の表示 */

  document.getElementById("questionStatus").textContent =
    `もんだい ${questionNumber}/${totalQuestions}`;

  document.getElementById("scoreStatus").textContent =
    `クリア ${score}`;

  document.getElementById("categoryName").textContent =
    `く ${currentCategory.name}`;

  document.getElementById("progress").textContent =
    `みつけた数：0 / ${requiredCorrect}`;

  const message = document.getElementById("message");

  message.textContent = "";
  message.className = "message";

  document.getElementById("nextButton").classList.add("hidden");

  /* カードを作る */

  const cardsArea = document.getElementById("cards");

  cardsArea.innerHTML = "";

  allCards.forEach(item => {

    const card = document.createElement("button");

    card.className = "card";

    card.innerHTML = `
      <img src="images/${item.image}" alt="${item.name}">
      <div class="card-name">${item.name}</div>
    `;

    card.onclick = () => checkAnswer(card, item);

    cardsArea.appendChild(card);
  });

  /* 音声を再生 */

  playCategoryAudio();
}

/* カテゴリー音声 */

function playCategoryAudio() {

  if (!currentCategory) return;

  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }

  currentAudio = new Audio(currentCategory.audio);

  const audioStatus = document.getElementById("audioStatus");

  audioStatus.textContent = "カテゴリーの音声を再生中";

  currentAudio.play()
    .then(() => {
      audioStatus.textContent = "カテゴリーの音声を再生中";
    })
    .catch(() => {
      audioStatus.textContent =
        "音声が再生されないときは、もういちど聞くを押してね";
    });

  currentAudio.onended = () => {
    audioStatus.textContent = "音声を聞きおわりました";
  };
}

/* カードを選んだとき */

function checkAnswer(card, item) {

  if (answeredItems.includes(item)) return;

  answeredItems.push(item);

  const message = document.getElementById("message");

  if (correctItems.includes(item)) {

    foundItems.push(item);

    card.classList.add("correct");
    card.disabled = true;

    message.textContent = "○ せいかい！";
    message.className = "message correct";

    document.getElementById("progress").textContent =
      `みつけた数：${foundItems.length} / ${requiredCorrect}`;

    /* 必要な正解数を見つけたら次へ */

    if (foundItems.length === requiredCorrect) {

      score++;

      document.getElementById("scoreStatus").textContent =
        `クリア ${score}`;

      message.textContent = "○ ぜんぶみつけたね！";

      document.getElementById("nextButton").classList.remove("hidden");
    }

  } else {

    card.classList.add("wrong");
    card.disabled = true;

    message.textContent = "× ちがうよ！ほかをさがしてみよう";
    message.className = "message wrong";
  }
}

/* 結果画面 */

function showResult() {

  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }

  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.remove("hidden");

  document.getElementById("resultScore").textContent =
    `${totalQuestions}問中 ${score}問クリア！`;
}

</script>

</body>
</html>
